name: PR description
# Before enabling: create the jev-approved environment with a required maintainer
# reviewer, and store OPENROUTER_API_KEY in that environment. Each run costs API quota.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions: {}
jobs:
  description:
    name: if-ai description
    runs-on: ubuntu-latest
    environment: jev-approved
    timeout-minutes: 2
    steps:
      # No checkout or execution of PR code. The trusted workflow supplies the condition.
      - uses: Victor-Casado/if-ai@v1.0.1
        with:
          mode: pr-body
          condition: The description explains the problem being solved and includes a concrete test plan.
          min-confidence: '0.85'
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
