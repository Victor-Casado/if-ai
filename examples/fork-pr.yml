name: PR condition including forks
# Before enabling: create the jev-approved environment with a required maintainer
# reviewer, and store OPENROUTER_API_KEY there. Review each run before approving it.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  condition:
    name: if-ai
    runs-on: ubuntu-latest
    environment: jev-approved
    timeout-minutes: 10
    steps:
      # Checkout only the trusted base. Never execute files from the PR head here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch PR head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        # gh supplies credentials for private repositories; nothing from the PR is executed.
        run: |
          gh auth setup-git
          git fetch --no-tags origin "refs/pull/${PR_NUMBER}/head"
      - uses: Victor-Casado/if-ai@v0.3.1
        with:
          mode: diff
          condition: This change does not remove or weaken existing tests.
          min-confidence: '0.90'
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
