name: Preserve tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  tests-policy:
    name: if-ai test preservation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Victor-Casado/if-ai@v0.2.0
        with:
          mode: diff
          condition: This change does not remove or weaken existing tests. Replacing a test with an equivalent or stronger test is acceptable.
          min-confidence: '0.90'
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
