name: Preserve tests
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  tests-policy:
    name: if-ai test preservation
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Victor-Casado/if-ai@v0.3.1
        with:
          mode: diff
          condition: This change does not remove or weaken existing tests. Replacing a test with an equivalent or stronger test is acceptable.
          min-confidence: '0.90'
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
