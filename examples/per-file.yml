name: Error message quality
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  messages:
    name: if-ai error messages
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Victor-Casado/if-ai@v0.1.0
        with:
          mode: per-file
          condition: >-
            Any newly added user-facing error message explains how to recover.
            Changes without user-facing error messages satisfy this condition.
          min-confidence: '0.85'
          api-key: ${{ secrets.TYPESAFE_API_KEY }}
