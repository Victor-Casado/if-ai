name: Error message quality
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  messages:
    name: if-ai error messages
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Victor-Casado/if-ai@v1.1.0
        with:
          mode: per-file
          condition: >-
            Any newly added user-facing error message explains how to recover.
            Changes without user-facing error messages satisfy this condition.
          min-confidence: '0.85'
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
