name: if-ai
on:
  pull_request:
    # No edited: a body edit does not change the diff. Guarding that with a
    # job-level if would instead publish a skipped check run that supersedes
    # the real verdict for the same commit.
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: if-ai-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Each rule is its own job rather than a matrix leg. A skipped matrix job
  # renders its name before expansion, so a skipped run would show a check
  # literally called "if-ai (${{ matrix.rule.name }})".
  tests:
    name: if-ai (tests)
    # Fork PRs receive no secrets, and Dependabot PRs are mechanical. Both are
    # skipped rather than evaluated, consistently for every event on a given
    # pull request, so no skip ever replaces a real verdict.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The local Action is the code under review, which is the point of running
      # it here. Safe only because fork PRs are excluded above; see SECURITY.md.
      - uses: ./
        with:
          condition: >-
            No existing test is deleted or weakened by this change. Replacing a
            test with an equivalent or stronger test satisfies this condition. A
            change that modifies no test file satisfies this condition.
          # Both halves of the judgement: whether a test changed, and whether
          # the source change justifies it. dist/ is a generated bundle of src/,
          # and everything else is noise the model would reason around.
          paths: |
            src/**
            test/**
          # 0.80 was the bar for this rule read against an unscoped diff. Scoped
          # to the evidence, it can be asked for more.
          min-confidence: '0.85'
          mode: diff
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
  secrets:
    name: if-ai (secrets)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          condition: >-
            No code added in this change logs an API key, request content, or a
            raw provider error response.
          # The code that can actually do this. scripts/live-smoke.mjs hands a
          # real key to a child process, so it belongs here. test/ is excluded:
          # its fixtures contain literal secret-looking strings by design.
          paths: |
            src/**
            scripts/**
          min-confidence: '0.85'
          mode: diff
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
