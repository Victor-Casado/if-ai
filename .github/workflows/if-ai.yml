name: if-ai
on:
  pull_request:
    # No edited: a body edit does not change the diff. Guarding that with a
    # job-level if would instead publish a skipped check run that supersedes
    # the real verdict for the same commit.
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: if-ai-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  # Each rule is its own job rather than a matrix leg. A skipped matrix job
  # renders its name before expansion, so a skipped run would show a check
  # literally called "if-ai (${{ matrix.rule.name }})".
  tests:
    name: if-ai (tests)
    # Fork PRs receive no secrets, and Dependabot PRs are mechanical. Both are
    # skipped rather than evaluated, consistently for every event on a given
    # pull request, so no skip ever replaces a real verdict.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The local Action is the code under review, which is the point of running
      # it here. Safe only because fork PRs are excluded above; see SECURITY.md.
      - uses: ./
        with:
          condition: >-
            No existing test is deleted or weakened by this change. Replacing a
            test with an equivalent or stronger test satisfies this condition. A
            change that modifies no test file satisfies this condition.
          # This rule asserts a universal negative across the whole diff, where
          # most of the evidence is absent. 0.80 is the bar that kind of claim
          # supports; rules with directly checkable evidence can ask for more.
          min-confidence: '0.80'
          mode: diff
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
  secrets:
    name: if-ai (secrets)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          condition: >-
            No code added in this change logs an API key, request content, or a
            raw provider error response.
          min-confidence: '0.80'
          mode: diff
          api-key: ${{ secrets.OPENROUTER_API_KEY }}
