name: Live Jev smoke test
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Jev API provider to test
        type: choice
        options: [typesafe, openrouter]
        default: typesafe
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test Jev through TypeSafe
        if: inputs.provider == 'typesafe'
        env:
          IF_AI_PROVIDER: typesafe
          IF_AI_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: node scripts/live-smoke.mjs
      - name: Test Jev through OpenRouter
        if: inputs.provider == 'openrouter'
        env:
          IF_AI_PROVIDER: openrouter
          IF_AI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/live-smoke.mjs
