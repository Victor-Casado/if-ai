name: Live Jev smoke test
on:
  workflow_dispatch:
    inputs:
      provider:
        description: Jev API provider to test
        type: choice
        options: [typesafe, openrouter]
        default: typesafe
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Test the bundled Action against Jev
        env:
          IF_AI_PROVIDER: ${{ inputs.provider }}
          IF_AI_API_KEY: ${{ secrets[inputs.provider == 'openrouter' && 'OPENROUTER_API_KEY' || 'TYPESAFE_API_KEY'] }}
        run: node scripts/live-smoke.mjs
